name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy application via Native SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "=== [1/5] Validating & Sanitizing Secrets ==="
          
          # Tự động làm sạch username (xóa bỏ khoảng trắng, dấu nháy, xuống dòng, phần @host nếu lỡ nhập kèm)
          CLEAN_USER=$(echo "${SSH_USER:-ec2-user}" | tr -d '\r\n\t "' | tr -d "'" | sed -e 's/@.*//')
          if [ -z "$CLEAN_USER" ]; then
            CLEAN_USER="ec2-user"
          fi

          # Tự động làm sạch host IP (xóa bỏ khoảng trắng, dấu nháy, phần user@ nếu lỡ nhập kèm)
          CLEAN_HOST=$(echo "${SSH_HOST}" | tr -d '\r\n\t "' | tr -d "'" | sed -e 's/.*@//')

          if [ -z "$CLEAN_HOST" ]; then
            echo "::error::Secret 'EC2_HOST' is missing or empty!"
            exit 1
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret 'EC2_SSH_KEY' is missing or empty!"
            exit 1
          fi

          echo "Target Host: $CLEAN_HOST"
          echo "Target User: $CLEAN_USER"

          echo "=== [2/5] Configuring SSH Key ==="
          mkdir -p ~/.ssh
          # Chuẩn hóa khóa SSH loại bỏ ký tự Windows CRLF
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          sed -i -e '$a\' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "=== [3/5] Connecting to EC2 & Executing Deployment ==="
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_rsa "$CLEAN_USER@$CLEAN_HOST" 'bash -s' << 'EOF'
            set -e

            echo "--> [Step 1] Locating project folder..."
            if [ -d "$HOME/DA.ATTT/.git" ]; then
              APP_DIR="$HOME/DA.ATTT"
            elif [ -d "$HOME/WEF-monitoring-system/.git" ]; then
              APP_DIR="$HOME/WEF-monitoring-system"
            elif [ -d "$HOME/DA.ATTT" ]; then
              APP_DIR="$HOME/DA.ATTT"
            else
              echo "Project not found, cloning repository..."
              git clone https://github.com/Hulk1809/WEF-monitoring-system.git "$HOME/WEF-monitoring-system"
              APP_DIR="$HOME/WEF-monitoring-system"
            fi

            echo "Working directory: $APP_DIR"
            cd "$APP_DIR"

            echo "--> [Step 2] Updating code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "--> [Step 3] Checking configuration & SSL..."
            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi

            mkdir -p nginx/ssl
            CRT_MD5=$(openssl x509 -noout -modulus -in nginx/ssl/tls.crt 2>/dev/null | openssl md5 2>/dev/null || echo "1")
            KEY_MD5=$(openssl rsa -noout -modulus -in nginx/ssl/tls.key 2>/dev/null | openssl md5 2>/dev/null || echo "2")
            if [ "$CRT_MD5" != "$KEY_MD5" ]; then
              echo "Synchronizing SSL certificate and private key..."
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout nginx/ssl/tls.key \
                -out nginx/ssl/tls.crt \
                -subj "/CN=3.1.210.184" || true
            fi

            echo "--> [Step 4] Starting Docker containers..."
            docker compose down || true
            docker compose up -d --build

            echo "--> [Step 5] Cleaning dangling images..."
            docker image prune -f

            echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
          EOF
