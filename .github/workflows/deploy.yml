name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy application via Native SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "=== [1/5] Validating Secrets ==="
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Secret 'EC2_HOST' is missing or empty!"
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::Secret 'EC2_USER' is missing or empty!"
            exit 1
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret 'EC2_SSH_KEY' is missing or empty!"
            exit 1
          fi

          echo "Connecting to Host: $SSH_HOST with User: $SSH_USER"

          echo "=== [2/5] Configuring SSH Key ==="
          mkdir -p ~/.ssh
          # Xóa bỏ ký tự xuống dòng CRLF (\r) của Windows và đảm bảo quyền 600
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          sed -i -e '$a\' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "=== [3/5] Connecting to EC2 & Executing Deployment ==="
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" 'bash -s' << 'EOF'
            set -e

            echo "--> [Step 1] Locating project folder..."
            if [ -d "$HOME/DA.ATTT/.git" ]; then
              APP_DIR="$HOME/DA.ATTT"
            elif [ -d "$HOME/WEF-monitoring-system/.git" ]; then
              APP_DIR="$HOME/WEF-monitoring-system"
            elif [ -d "$HOME/DA.ATTT" ]; then
              APP_DIR="$HOME/DA.ATTT"
            else
              echo "Project not found, cloning repository..."
              git clone https://github.com/Hulk1809/WEF-monitoring-system.git "$HOME/WEF-monitoring-system"
              APP_DIR="$HOME/WEF-monitoring-system"
            fi

            echo "Target Directory: $APP_DIR"
            cd "$APP_DIR"

            echo "--> [Step 2] Updating code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "--> [Step 3] Checking configuration & SSL..."
            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi

            mkdir -p nginx/ssl
            if [ ! -f nginx/ssl/tls.key ] || [ ! -f nginx/ssl/tls.crt ]; then
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout nginx/ssl/tls.key \
                -out nginx/ssl/tls.crt \
                -subj "/CN=localhost" || true
            fi

            echo "--> [Step 4] Starting Docker containers..."
            docker compose down || true
            docker compose up -d --build

            echo "--> [Step 5] Cleaning dangling images..."
            docker image prune -f

            echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
          EOF
