services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=securedb
    volumes:
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secure-net
    # KHÔNG khai báo ports để đảm bảo an toàn, không mở cổng ra ngoài host

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    networks:
      - secure-net
    restart: always

  secure-app:
    build:
      context: ./secure-app
      dockerfile: Dockerfile
    container_name: secure-app
    environment:
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
      - REDIS_CONNECTION=redis:6379
    depends_on:
      - postgres-db
      - redis
    networks:
      - secure-net

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - secure-app
    networks:
      - secure-net
    restart: always

  monitor-module:
    build:
      context: ./monitor-module
      dockerfile: Dockerfile
    container_name: monitor-module
    ports:
      - "5001:5001" # Expose Web Monitor Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Mount Docker Socket
      - monitor_data:/app/data # Lưu trữ CSDL SQLite
    depends_on:
      - secure-app
      - postgres-db
      - redis
    networks:
      - secure-net
    environment:
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - REDIS_CONNECTION=redis:6379
    restart: always

networks:
  secure-net:
    driver: bridge

volumes:
  postgres_data:
  monitor_data:
